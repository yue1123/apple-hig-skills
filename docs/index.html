<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the apple-hig skill changes</title>
<meta name="description" content="Drag a Dynamic Type slider and watch which of two React Native screens survives. A before/after demo of the apple-hig agent skill.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="What the apple-hig skill changes">
<meta property="og:description" content="Two React Native screens that look identical until you change a system setting.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
             "Songti SC", STSong, "Noto Serif CJK SC", Georgia, serif;
    --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --ink: #151a1f; --ink-2: #4a555e; --ink-3: #7d8890;
    --paper: #f1f4f6; --card: #ffffff; --rule: #d9e0e4; --rule-soft: #e8edef;
    --good: #14657f; --good-bg: #e4eff3;
    --bad: #a4642f;  --bad-bg: #f7ebde;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e7ecee; --ink-2: #a7b3ba; --ink-3: #6d7b84;
      --paper: #0e1317; --card: #161d22; --rule: #29333a; --rule-soft: #1f282e;
      --good: #66bad6; --good-bg: #16323d; --bad: #dda471; --bad-bg: #33251a;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e7ecee; --ink-2: #a7b3ba; --ink-3: #6d7b84;
    --paper: #0e1317; --card: #161d22; --rule: #29333a; --rule-soft: #1f282e;
    --good: #66bad6; --good-bg: #16323d; --bad: #dda471; --bad-bg: #33251a;
  }
  :root[data-theme="light"] {
    --ink: #151a1f; --ink-2: #4a555e; --ink-3: #7d8890;
    --paper: #f1f4f6; --card: #ffffff; --rule: #d9e0e4; --rule-soft: #e8edef;
    --good: #14657f; --good-bg: #e4eff3; --bad: #a4642f; --bad-bg: #f7ebde;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  /* Chinese needs more leading and a narrower measure to read well. */
  html[lang="zh-CN"] body { line-height: 1.8; }
  html[lang="zh-CN"] .prose { max-width: 38em; }
  html[lang="zh-CN"] h1 { line-height: 1.28; letter-spacing: .005em; font-weight: 500; }
  html[lang="zh-CN"] h2 { line-height: 1.4; font-weight: 500; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: clamp(24px,4vw,56px) clamp(16px,3vw,32px) 88px;
          display: flex; flex-direction: column; gap: 44px; }
  p { margin: 0; color: var(--ink-2); }
  .prose { max-width: 64ch; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px,4.4vw,42px);
       line-height: 1.12; margin: 10px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(20px,2.6vw,26px);
       margin: 0; line-height: 1.25; text-wrap: balance; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em;
             text-transform: uppercase; color: var(--ink-3); margin: 0; }
  section { display: flex; flex-direction: column; gap: 18px; }
  .sechead { border-top: 1px solid var(--rule); padding-top: 18px;
             display: flex; flex-direction: column; gap: 8px; }
  .sechead p { max-width: 74ch; }
  html[lang="zh-CN"] .sechead p { max-width: 44em; }
  .num { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-3); margin: 0; }

  .lang { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em;
          color: var(--ink-3); margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
  .lang button {
    font: inherit; background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--good); text-decoration: none;
  }
  .lang button:hover { text-decoration: underline; }
  .lang button:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; border-radius: 2px; }
  .lang button[aria-current="true"] { color: var(--ink); cursor: default; text-decoration: none; }

  /* ---------- controls ---------- */
  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
           padding: 18px 20px; display: grid; gap: 16px 28px;
           grid-template-columns: minmax(230px,1.15fr) minmax(250px,1fr); }
  @media (max-width: 760px) { .panel { grid-template-columns: 1fr; } }
  .panel.one { grid-template-columns: 1fr; }
  .ctl { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .ctl-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
               text-transform: uppercase; color: var(--ink-3);
               display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  html[lang="zh-CN"] .ctl-label { font-family: var(--sans); font-size: 12px;
                                  letter-spacing: .06em; text-transform: none; }
  .ctl-val { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums;
             letter-spacing: 0; font-size: 10.5px; }
  input[type=range] { width: 100%; accent-color: var(--good); margin: 0; }
  input[type=range]:focus-visible { outline: 2px solid var(--good); outline-offset: 3px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .tog, .btn {
    font: inherit; font-size: 13px; cursor: pointer; background: transparent; color: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 999px; padding: 5px 13px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tog:hover, .btn:hover { border-color: var(--ink-3); }
  .tog:focus-visible, .btn:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }
  .tog .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); flex: none; }
  .tog[aria-pressed="true"] { color: var(--ink); border-color: var(--good); background: var(--good-bg); }
  .tog[aria-pressed="true"] .dot { background: var(--good); }
  .btn { border-radius: 4px; color: var(--ink); }
  .hint { font-size: 12.5px; color: var(--ink-3); grid-column: 1/-1; margin: 0; max-width: 88ch; }
  html[lang="zh-CN"] .hint { max-width: 52em; line-height: 1.75; }
  .hint code, .flag code, td code, footer code {
    font-family: var(--mono); font-size: .88em; background: rgba(127,127,127,.15);
    padding: 0 4px; border-radius: 2px; color: var(--ink);
  }

  /* ---------- stage ---------- */
  .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px,1fr)); gap: 26px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .col-head { display: flex; flex-direction: column; gap: 3px; }
  .col-tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  html[lang="zh-CN"] .col-tag { font-family: var(--sans); font-size: 12.5px; letter-spacing: .04em; text-transform: none; }
  .col-a .col-tag { color: var(--bad); }
  .col-b .col-tag { color: var(--good); }
  .col-sub { font-size: 13px; color: var(--ink-3); }

  .phone { border: 1px solid var(--rule); border-radius: 26px; padding: 8px; background: var(--card);
           width: 408px; max-width: 100%; margin: 0 auto; }
  .screen {
    position: relative; height: 470px; overflow: hidden; border-radius: 19px;
    /* the mockup uses the real system face: SF on Apple hardware, PingFang for Chinese */
    font-family: -apple-system, system-ui, "PingFang SC", "Helvetica Neue", sans-serif;
    line-height: normal;
    --ios-grouped-bg: #f2f2f7; --ios-card: #ffffff;
    --ios-label: #000000; --ios-label-2: rgba(60,60,67,.6); --ios-label-3: #c4c4c6;
    --ios-separator: #c6c6c8; --ios-tint: #007aff; --ios-red: #ff3b30;
    --ios-bar: rgba(249,249,249,.78); --ios-bar-opaque: #f9f9f9;
    --ios-fill: rgba(120,120,128,.12); --ios-press: #d1d1d6;
    --w-body: 400; --w-title: 700;
  }
  .screen.adaptive[data-appearance="dark"] {
    --ios-grouped-bg: #000000; --ios-card: #1c1c1e;
    --ios-label: #ffffff; --ios-label-2: rgba(235,235,245,.6); --ios-label-3: #48484a;
    --ios-separator: #38383a; --ios-tint: #0a84ff; --ios-red: #ff453a;
    --ios-bar: rgba(30,30,32,.76); --ios-bar-opaque: #1c1c1e;
    --ios-fill: rgba(120,120,128,.24); --ios-press: #2c2c2e;
  }
  .screen.adaptive.contrast { --ios-label-2: rgba(60,60,67,.92); --ios-separator: #8e8e93; --ios-tint: #0040dd; }
  .screen.adaptive.contrast[data-appearance="dark"] { --ios-label-2: rgba(235,235,245,.92); --ios-separator: #6e6e73; --ios-tint: #5ea9ff; }
  .screen.bold { --w-body: 600; --w-title: 800; }

  .body-scroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .list-a { background: #fff; padding: 56px 0 54px; }
  .list-b { background: var(--ios-grouped-bg); padding: 60px 0 62px; min-height: 100%; }
  .card-b { background: var(--ios-card); border-radius: 10px; margin: 0 16px; overflow: hidden; }

  .hdr-js {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3; height: 56px; overflow: hidden;
    background: #fff; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: center; color: #000; font-weight: 600;
  }
  .hdr-native {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 7px 16px 9px;
    background: var(--ios-bar); border-bottom: .5px solid var(--ios-separator); color: var(--ios-label);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  .hdr-native .big { display: block; font-weight: var(--w-title); letter-spacing: -.021em; line-height: 1.16; }

  .row { display: flex; align-items: center; gap: 10px; padding-inline: 16px; position: relative; }
  .row-a { height: 56px; overflow: hidden; background: #fff; }
  .row-b { min-height: 44px; padding-block: 11px; background: var(--ios-card); }
  .row-a .lbl { color: #333; font-weight: 400; }   /* a literal weight: Bold Text can't reach it */
  .row-b .lbl { color: var(--ios-label); flex-shrink: 1; font-weight: var(--w-body); }
  .lbl { flex: 1 1 auto; min-width: 0; }
  .sub { display: block; }
  .row-a .sub { color: #999; }
  .row-b .sub { color: var(--ios-label-2); }
  .sep-a { height: 1px; background: #eee; margin-left: 16px; }
  .sep-b { height: .5px; background: var(--ios-separator); margin-left: 16px; }
  .row-tall { height: auto; padding-block: 14px; }

  .row-a:active { opacity: .55; }                    /* Android-style fade */
  .row-b:active { background: var(--ios-press); }    /* iOS-style fill */

  .chev { flex: none; }
  .chev-mat { stroke: #999; stroke-width: 2.5; }
  .chev-sf { stroke: var(--ios-label-3); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .tabs { position: absolute; bottom: 0; left: 0; right: 0; z-index: 3; display: flex; padding: 7px 0 9px; }
  .tabs-fake { background: rgba(255,255,255,.8); border-top: 1px solid #eee; }
  .tabs-native { background: var(--ios-bar); border-top: .5px solid var(--ios-separator);
                 -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  .screen.opaque .hdr-native, .screen.opaque .tabs-native {
    background: var(--ios-bar-opaque); -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  .tab { flex: 1; text-align: center; font-size: 10px; line-height: 1.5; color: var(--ios-label-3); }
  .tabs-fake .tab { color: #999; }
  .tab.on { color: var(--ios-tint); }
  .tabs-fake .tab.on { color: #007aff; }
  .tab .g { display: block; font-size: 15px; line-height: 1.1; }

  .icon-btn { flex: none; display: grid; place-items: center; border-radius: 6px;
              background: var(--ios-fill); width: 28px; height: 28px; }
  .icon-btn-b { position: relative; }
  .icon-btn-b::after { content: ''; position: absolute; inset: -8px; }   /* hitSlop to 44 */
  .hitring { position: absolute; z-index: 4; border: 1.5px solid; border-radius: 8px;
             pointer-events: none; display: none; }
  .screen.showHit .hitring { display: block; }
  .hitring i { position: absolute; right: -1px; bottom: 100%; font-family: var(--mono);
               font-size: 9px; font-style: normal; padding: 0 4px; border-radius: 3px 3px 0 0;
               color: #fff; line-height: 1.7; white-space: nowrap; }
  .hitring.bad { border-color: #ff3b30; }
  .hitring.bad i { background: #ff3b30; }
  .hitring.ok { border-color: #34c759; }
  .hitring.ok i { background: #34c759; }

  .a11y-box { position: absolute; z-index: 4; border: 2px solid var(--good); border-radius: 4px;
              pointer-events: none; display: none; }
  .screen.showA11y .a11y-box { display: block; }
  .a11y-tag { position: absolute; left: -2px; top: 0; transform: translateY(-100%);
              font-family: var(--mono); font-size: 9px; line-height: 1.6; padding: 1px 5px;
              background: var(--good); color: #fff; border-radius: 3px 3px 0 0; white-space: nowrap; }
  .a11y-box.miss { border-color: var(--bad); }
  .a11y-box.miss .a11y-tag { background: var(--bad); }

  /* ---------- alert / action sheet ---------- */
  .scrim { position: absolute; inset: 0; z-index: 6; background: rgba(0,0,0,.22);
           display: none; align-items: center; justify-content: center; }
  .scrim.on { display: flex; }
  .scrim.sheet { align-items: flex-end; padding: 8px; }
  .alert {
    width: 270px; border-radius: 14px; overflow: hidden; text-align: center;
    background: rgba(248,248,248,.94); color: #000;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    animation: pop .18s ease-out;
  }
  .alert h4 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .alert .msg { margin: 3px 0 0; font-size: 13px; color: #000; line-height: 1.35; }
  .alert .pad { padding: 19px 16px 15px; }
  .alert .acts { display: flex; border-top: .5px solid rgba(60,60,67,.29); }
  .alert .acts button { flex: 1; font: inherit; font-size: 17px; padding: 11px 4px;
                        background: none; border: 0; color: #007aff; cursor: pointer; }
  .alert .acts button + button { border-left: .5px solid rgba(60,60,67,.29); }
  .alert .acts .danger { color: #ff3b30; font-weight: 600; }

  .asheet { width: 100%; animation: rise .28s cubic-bezier(.32,.72,0,1); }
  .asheet .grp { border-radius: 13px; overflow: hidden; background: rgba(248,248,248,.94);
                 -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .asheet .grp + .grp { margin-top: 8px; }
  .asheet .title { padding: 14px 16px; font-size: 13px; color: rgba(60,60,67,.6);
                   text-align: center; border-bottom: .5px solid rgba(60,60,67,.29); line-height: 1.35; }
  /* 20 pt label + 25 pt line + 16 pt padding = the HIG's 57 pt action-sheet row */
  .asheet button { display: block; width: 100%; font: inherit; font-size: 20px; line-height: 25px;
                   padding: 16px 8px; background: none; border: 0; color: #007aff; cursor: pointer;
                   text-align: center; }
  .asheet button + button { border-top: .5px solid rgba(60,60,67,.29); }
  .asheet .danger { color: #ff3b30; }
  .asheet .cancel { font-weight: 600; }
  @keyframes pop  { from { transform: scale(1.14); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes rise { from { transform: translateY(100%) } to { transform: none } }

  .toast {
    position: absolute; left: 12px; right: 12px; bottom: 62px; z-index: 7;
    background: rgba(30,30,32,.92); color: #fff; border-radius: 12px; padding: 11px 14px;
    display: none; align-items: center; gap: 10px; font-size: 14px;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    animation: rise .24s cubic-bezier(.32,.72,0,1);
  }
  .toast.on { display: flex; }
  .toast button { margin-left: auto; font: inherit; font-size: 15px; font-weight: 600;
                  background: none; border: 0; color: #64d2ff; cursor: pointer; }

  /* ---------- loading ---------- */
  .spinner-wrap { position: absolute; inset: 0; z-index: 5; background: #fff; display: none;
                  align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  .spinner-wrap.on { display: flex; }
  .spinner { width: 30px; height: 30px; border-radius: 50%;
             border: 3px solid rgba(0,0,0,.12); border-top-color: #8e8e93;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .spinner-wrap span { font-size: 13px; color: #999; }

  .sk { background: var(--ios-fill); border-radius: 6px; display: block; }
  .sk.shimmer {
    background-image: linear-gradient(100deg, transparent 20%, rgba(150,150,150,.28) 50%, transparent 80%);
    background-size: 240% 100%; animation: sweep 1.3s ease-in-out infinite;
  }
  @keyframes sweep { from { background-position: 180% 0 } to { background-position: -80% 0 } }

  @media (prefers-reduced-motion: reduce) {
    /* This page follows the rule it argues for. */
    .alert, .asheet, .toast { animation: none; }
    .sk.shimmer { animation: none; background-image: none; }
    .spinner { animation-duration: 2.4s; }
  }

  /* ---------- flags ---------- */
  .flags { display: flex; flex-direction: column; gap: 7px; }
  .flag { font-size: 12.5px; line-height: 1.55; padding: 8px 11px; border-radius: 3px;
          display: flex; gap: 9px; align-items: baseline; }
  html[lang="zh-CN"] .flag { line-height: 1.72; }
  .flag-bad { background: var(--bad-bg); color: var(--ink); box-shadow: inset 2px 0 0 var(--bad); }
  .flag-good { background: var(--good-bg); color: var(--ink); box-shadow: inset 2px 0 0 var(--good); }
  .flag .n { font-family: var(--mono); font-size: 11px; opacity: .75; flex: none; }
  .quiet { font-size: 12.5px; color: var(--ink-3); padding: 8px 0; margin: 0; }

  /* ---------- tables ---------- */
  .scroller { overflow-x: auto; border: 1px solid var(--rule); border-radius: 4px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; min-width: 700px; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13.5px; vertical-align: top; line-height: 1.55; }
  html[lang="zh-CN"] td.why, html[lang="zh-CN"] td.what { line-height: 1.72; }
  thead th { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
             color: var(--ink-3); font-weight: 400; border-bottom: 1px solid var(--rule); }
  html[lang="zh-CN"] thead th { font-family: var(--sans); font-size: 12px;
                                letter-spacing: .04em; text-transform: none; }
  thead th.ha { color: var(--bad); }
  thead th.hb { color: var(--good); }
  tbody tr + tr td { border-top: 1px solid var(--rule-soft); }
  td.mono { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; }
  td.ca { color: var(--ink-2); }
  td.cb { color: var(--ink); }
  td.why { color: var(--ink-2); }
  td.ref { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: pre-line; }
  td.dm { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  footer { border-top: 1px solid var(--rule); padding-top: 18px; font-size: 12.5px; color: var(--ink-3); }
  html[lang="zh-CN"] footer { line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="lang">
      <button id="langEn" aria-current="true">English</button><span>·</span><button id="langZh">简体中文</button>
    </p>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="h1"></h1>
    <div class="prose" style="margin-top:14px">
      <p data-t="lede1"></p>
      <p data-t="lede2"></p>
    </div>
  </header>

  <!-- ============================ 01 ============================ -->
  <section>
    <div class="sechead">
      <p class="num" data-t="d1num"></p>
      <h2 data-t="d1h2"></h2>
      <p style="font-size:14px" data-t="d1p"></p>
    </div>

    <div class="panel">
      <div class="ctl">
        <span class="ctl-label"><span data-t="dtLabel"></span><span class="ctl-val" id="dtVal"></span></span>
        <input type="range" id="dt" min="0" max="11" step="1" value="3" data-t-aria="dtLabel">
      </div>
      <div class="ctl">
        <span class="ctl-label"><span data-t="togLabel"></span></span>
        <div class="toggles">
          <button class="tog" id="tDark" aria-pressed="false"><span class="dot"></span><span data-t="tgDark"></span></button>
          <button class="tog" id="tBold" aria-pressed="false"><span class="dot"></span><span data-t="tgBold"></span></button>

    for (var i = 0; i < nodes.length; i++) {

      if (d[k] != null) nodes[i].innerHTML = d[k];
    }
    var arias = document.querySelectorAll('[data-t-aria]');
    for (var j = 0; j < arias.length; j++) {
      arias[j].setAttribute('aria-label', d[arias[j].getAttribute('data-t-aria')]);

    document.querySelectorAll('#scr2B [data-t="libItem"]').forEach(function (el) {
      el.innerHTML = d.libItemB;
    });
    renderTabs(); renderTables(); renderStaticFlags(); renderFeed();
    build();
    if (push) {
      try {
        var u = new URL(location.href);
        u.searchParams.set('lang', L);
        history.replaceState(null, '', u);
        localStorage.setItem('hig-demo-lang', L);
      } catch (e) { /* file:// or storage blocked — ignore */ }

  function build() {
    var i = +dt.value, pt = STEPS[i][1];
    dtVal.textContent = STEPS[i][0] + ' · ' + pt + ' pt' + (i === 3 ? ' · ' + d.dflt : '');
    var ptA = Math.round(pt * 16 / 17);
    var subA = Math.round(ptA * 12 / 16), subB = Math.round(pt * 13 / 17);

    var a = '', b = '';
    d.rows.forEach(function (r, n) {
      var last = n === d.rows.length - 1;

           '<span class="sub" style="font-size:' + subA + 'px">' + r[1] + '</span></span>' +
           (last ? gear('') : chev(false)) + '</div>' + (last ? '' : '<div class="sep-a"></div>');

           'px;line-height:' + Math.round(subB * 18 / 13) + 'px">' + r[1] + '</span></span>' +

  function measure() {
    var A = [], B = [];
    var rows = listA.querySelectorAll('.row-a'), worst = 0;
    for (var k = 0; k < rows.length; k++) {
      var l = rows[k].querySelector('.lbl');
      worst = Math.max(worst, l.scrollHeight - rows[k].clientHeight);
    }
    if (worst > 1) { A.push(d.fClipA); B.push(d.fClipB); }
    if (hdrTitleA.scrollHeight - $('hdrA').clientHeight > 1) { A.push(d.fHdrA); B.push(d.fHdrB); }
    if (st.dark) { A.push(d.fDarkA); B.push(d.fDarkB); }
    if (st.bold) { A.push(d.fBoldA); B.push(d.fBoldB); }
    if (st.contrast) { A.push(d.fContA); B.push(d.fContB); }
    if (st.opaque) { A.push(d.fTransA); B.push(d.fTransB); }
    if (st.hit) { A.push(d.fHitA); B.push(d.fHitB); }
    if (st.a11y) { A.push(d.fA11yA); B.push(d.fA11yB); }
    if (!A.length) {

      $('flagsB').innerHTML = '<p class="quiet">' + d.quiet + '</p>';

  function place() {
    [[$('a11yA'), scrA, '.row-a'], [$('a11yB'), scrB, '.row-b']].forEach(function (t) {
      var box = t[0], scr = t[1], rows = scr.querySelectorAll(t[2]), row = rows[LONGEST];
      if (!row) { box.style.visibility = 'hidden'; return; }
      var r = row.getBoundingClientRect(), s = scr.getBoundingClientRect();
      box.style.visibility = 'visible';
      box.style.left = (r.left - s.left + 2) + 'px';
      box.style.top = (r.top - s.top) + 'px';
      box.style.width = (r.width - 4) + 'px';
      box.style.height = r.height + 'px';
    });
    [[$('hitA'), scrA, 28], [$('hitB'), scrB, 44]].forEach(function (t) {
      var ring = t[0], scr = t[1], size = t[2], btn = scr.querySelector('.icon-btn');

      var r = btn.getBoundingClientRect(), s = scr.getBoundingClientRect();

      ring.style.visibility = 'visible';
      ring.style.width = size + 'px'; ring.style.height = size + 'px';
      ring.style.left = (cx - size / 2) + 'px'; ring.style.top = (cy - size / 2) + 'px';

          '%;height:17px"></span><span class="sk shimmer" style="width:' + (40 - n * 6) +
          '%;height:13px;margin-top:6px"></span></span>';
      return '<div class="row row-b">' + body + '</div>' +
             (n < d.feed.length - 1 ? '<div class="sep-b"></div>' : '');
    }).join('');
  }
  var timer = null;
  function renderFeed() { $('list3A').innerHTML = feedA(); $('list3B').innerHTML = feedB(true); }
  $('reload').addEventListener('click', function () {
    if (timer) clearTimeout(timer);
    $('spin3A').classList.add('on');
    $('list3B').innerHTML = feedB(false);
    timer = setTimeout(function () {
      $('spin3A').classList.remove('on');
      $('list3B').innerHTML = feedB(true);
    }, 2000);
  });

  /* ---------- boot ---------- */
  ['scrA', 'scrB', 'scr2B', 'scr3B'].forEach(function (id) {
    $(id).setAttribute('data-appearance', 'light');
  });
  var initial = 'en';
  try {
    var q = new URL(location.href).searchParams.get('lang');
    var saved = localStorage.getItem('hig-demo-lang');
    if (q && T[q]) initial = q;
    else if (saved && T[saved]) initial = saved;
    else if (/^zh/i.test(navigator.language || '')) initial = 'zh-CN';
  } catch (e) {
    if (/^zh/i.test(navigator.language || '')) initial = 'zh-CN';
  }
  setLang(initial, false);
})();
</script>
</body>
</html>
